<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ name }} - Binary File</title>
    <link rel="stylesheet" href="/media/editor/smart.css">
</head>
<body class="binary-page">
    <main class="binary-card">
        <div class="binary-icon" aria-hidden="true">⬢</div>
        <p class="binary-label">BINARY FILE</p>
        <h1>{{ name }}</h1>
        <p class="binary-meta">
            This file is binary or is not valid UTF-8 source text, so it cannot be
            displayed safely in the code viewer.
        </p>
        <p class="binary-meta">
            Type: {{ mime_type }}<br>
            Size: {{ size }} bytes
        </p>
        <div class="binary-actions">
            <a class="button primary" href="{{ download_url }}">Download file</a>
            <button class="button" type="button" onclick="closeTab()">Close</button>
        </div>
    </main>

    <script>
        function closeTab() {
            window.close();
            window.setTimeout(function () {
                if (!window.closed) {
                    window.history.back();
                }
            }, 150);
        }
    </script>

    <style>
        html, body {
            min-height: 100%;
            margin: 0;
            background: #f4f7fb;
            color: #172033;
            font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        }

        .binary-page {
            display: grid;
            min-height: 100vh;
            place-items: center;
            padding: 24px;
        }

        .binary-card {
            width: min(100%, 520px);
            padding: 36px;
            border: 1px solid #e4e9f0;
            border-radius: 16px;
            background: #ffffff;
            box-shadow: 0 15px 40px rgba(15, 23, 42, 0.08);
            text-align: center;
        }

        .binary-icon {
            display: grid;
            width: 58px;
            height: 58px;
            margin: 0 auto 18px;
            place-items: center;
            border-radius: 16px;
            background: #eef2ff;
            color: #4f46e5;
            font-size: 27px;
        }

        .binary-label {
            margin: 0 0 8px;
            color: #718096;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.14em;
        }

        h1 {
            margin: 0 0 14px;
            overflow-wrap: anywhere;
            font-size: 20px;
        }

        .binary-meta {
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
        }

        .binary-actions {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 24px;
        }

        .button {
            display: inline-flex;
            min-height: 40px;
            align-items: center;
            justify-content: center;
            padding: 0 16px;
            border: 1px solid #d7dee8;
            border-radius: 9px;
            background: #ffffff;
            color: #334155;
            cursor: pointer;
            font: inherit;
            font-size: 13px;
            font-weight: 650;
            text-decoration: none;
        }

        .button.primary {
            border-color: #4f46e5;
            background: #4f46e5;
            color: #ffffff;
        }

        .button:hover {
            filter: brightness(0.97);
        }
    </style>
</body>
</html>
