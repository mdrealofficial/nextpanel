<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>{{ name }} - File Manager</title>

    <link rel="icon" type="image/png" sizes="32x32" href="{{ branding.brand_icon }}">

    <!-- Use your locally downloaded, pinned ACE build. -->
    <script src="/media/editor/ace-1.36.5/ace.js"></script>
    <script>
        ace.config.set('basePath', '/media/editor/ace-1.36.5');
    </script>
</head>
<body>
    <header class="viewer-header">
        <div class="viewer-title">
            <div class="file-icon" aria-hidden="true">&lt;/&gt;</div>
            <div class="file-heading">
                <div class="eyebrow">FILE VIEWER</div>
                <h1 title="{{ name }}">{{ name }}</h1>
            </div>
        </div>

        <button
            type="button"
            class="close-button"
            onclick="closeTab()"
            aria-label="Close file viewer"
            title="Close file viewer">
            <span class="close-symbol" aria-hidden="true">&times;</span>
            <span class="close-label">Close</span>
        </button>
    </header>

    <main class="viewer-main">
        <section
            id="editor"
            aria-label="Read-only source viewer"
            aria-readonly="true"></section>
    </main>

    <!-- Safely transfers arbitrary source text, including PHP and HTML, to JavaScript. -->
    {{ content|json_script:"ace-content" }}

    <script>
        const content = JSON.parse(
            document.getElementById('ace-content').textContent
        );

        const editor = ace.edit('editor');

        function applyAceThemeByBrowser() {
            const preference = window.matchMedia(
                '(prefers-color-scheme: dark)'
            );

            editor.setTheme(
                preference.matches
                    ? 'ace/theme/tomorrow_night'
                    : 'ace/theme/chrome'
            );

            if (typeof preference.addEventListener === 'function') {
                preference.addEventListener('change', applyAceThemeByBrowser);
            } else if (typeof preference.addListener === 'function') {
                preference.addListener(applyAceThemeByBrowser);
            }
        }

        const modeMap = {
            php: 'php',
            phtml: 'php',
            php3: 'php',
            php4: 'php',
            php5: 'php',
            phar: 'php',
            html: 'html',
            htm: 'html',
            xhtml: 'html',
            css: 'css',
            scss: 'scss',
            less: 'less',
            js: 'javascript',
            jsx: 'javascript',
            mjs: 'javascript',
            cjs: 'javascript',
            ts: 'typescript',
            tsx: 'typescript',
            json: 'json',
            json5: 'json',
            py: 'python',
            pyw: 'python',
            xml: 'xml',
            svg: 'xml',
            sh: 'sh',
            bash: 'sh',
            zsh: 'sh',
            sql: 'sql',
            md: 'markdown',
            markdown: 'markdown',
            yaml: 'yaml',
            yml: 'yaml',
            java: 'java',
            c: 'c_cpp',
            h: 'c_cpp',
            cpp: 'c_cpp',
            hpp: 'c_cpp',
            cs: 'csharp',
            go: 'golang',
            rs: 'rust',
            rb: 'ruby',
            ini: 'ini',
            conf: 'ini',
            cfg: 'ini',
            htaccess: 'apache_conf',
            dockerfile: 'dockerfile',
            vue: 'vue'
        };

        const extension = String('{{ ext|escapejs }}')
            .toLowerCase()
            .replace(/^\./, '')
            .replace(/[^a-z0-9_+-]/g, '');

        const modeName = modeMap[extension] || 'text';

        applyAceThemeByBrowser();
        editor.session.setMode(`ace/mode/${modeName}`);

        // This is a viewer, not an editor. Disable the old ACE parser worker
        // so it cannot display false PHP 8 syntax warnings.
        editor.session.setUseWorker(false);

        editor.setValue(content || '', -1);
        editor.clearSelection();
        editor.setReadOnly(true);

        editor.setOptions({
            readOnly: true,
            highlightActiveLine: false,
            highlightGutterLine: false,
            showPrintMargin: false,
            behavioursEnabled: false,
            displayIndentGuides: true,
            wrap: true,
            navigateWithinSoftTabs: false,
			fontSize: "{{my_settings.font_size}}px", 
        });

        editor.session.setUseWrapMode(true);
        editor.session.setWrapLimitRange(null, null);
        editor.resize(true);

        function closeTab() {
            window.close();

            // Browsers may block window.close() for tabs not opened by script.
            window.setTimeout(function () {
                if (!window.closed) {
                    window.history.back();
                }
            }, 150);
        }
    </script>

    <style>
        :root {
            color-scheme: light;
            --page-bg: #f4f7fb;
            --panel-bg: #ffffff;
            --border: #e4e9f0;
            --text: #172033;
            --muted: #718096;
            --accent: #4f46e5;
            --accent-soft: #eef2ff;
            --shadow: 0 12px 35px rgba(15, 23, 42, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: var(--page-bg);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system,
                         BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .viewer-header {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 72px;
            padding: 14px 22px;
            background: rgba(255, 255, 255, 0.96);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 2px 12px rgba(15, 23, 42, 0.04);
        }

        .viewer-title {
            display: flex;
            align-items: center;
            min-width: 0;
            gap: 12px;
        }

        .file-icon {
            display: grid;
            place-items: center;
            width: 40px;
            height: 40px;
            flex: 0 0 40px;
            border-radius: 10px;
            background: var(--accent-soft);
            color: var(--accent);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 13px;
            font-weight: 700;
        }

        .file-heading {
            min-width: 0;
        }

        .eyebrow {
            margin-bottom: 2px;
            color: var(--muted);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.13em;
        }

        .viewer-title h1 {
            max-width: min(65vw, 760px);
            margin: 0;
            overflow: hidden;
            color: var(--text);
            font-size: 15px;
            font-weight: 650;
            line-height: 1.3;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .close-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            min-height: 38px;
            padding: 0 13px;
            border: 1px solid #e2e8f0;
            border-radius: 9px;
            background: #ffffff;
            color: #475569;
            cursor: pointer;
            font-size: 13px;
            font-weight: 650;
            transition: background 0.15s ease, border-color 0.15s ease,
                        color 0.15s ease, transform 0.15s ease;
        }

        .close-symbol {
            font-size: 24px;
            font-weight: 300;
            line-height: 1;
        }

        .close-button:hover {
            border-color: #cbd5e1;
            background: #f8fafc;
            color: #0f172a;
            transform: translateY(-1px);
        }

        .close-button:focus-visible {
            outline: 3px solid rgba(79, 70, 229, 0.25);
            outline-offset: 2px;
        }

        .viewer-main {
            width: 100%;
            height: calc(100vh - 72px);
            padding: 18px;
        }

        #editor {
            width: 100%;
            height: 100%;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: var(--panel-bg);
            box-shadow: var(--shadow);
        }

        @media (max-width: 600px) {
            .viewer-header {
                min-height: 64px;
                padding: 11px 14px;
            }

            .viewer-main {
                height: calc(100vh - 64px);
                padding: 10px;
            }

            .file-icon {
                width: 34px;
                height: 34px;
                flex-basis: 34px;
                border-radius: 8px;
                font-size: 11px;
            }

            .viewer-title h1 {
                max-width: 48vw;
                font-size: 13px;
            }

            .close-button {
                width: 38px;
                min-height: 36px;
                padding: 0;
            }

            .close-label {
                display: none;
            }
        }
    </style>
</body>
</html>
