server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nextpanel/ssl/cert.pem;
    ssl_certificate_key /etc/nextpanel/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Auto-redirect plain HTTP requests to HTTPS on the same port
    error_page 497 301 =307 https://$host:$server_port$request_uri;

    client_max_body_size 1024M;

    # Static media assets
    location /media/ {
        alias /usr/local/nextpanel/media/;
        expires 30d;
    }

    # Static assets
    location /static/ {
        alias /usr/local/nextpanel/static/;
        expires 30d;
    }

    # Reverse proxy to Gunicorn daemon
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 90;
        proxy_send_timeout 120;
        proxy_read_timeout 120;
        proxy_buffering off;
    }
}
